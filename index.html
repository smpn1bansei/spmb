<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Dalam Perbaikan - SMPN 1 Bandar Seikijang</title>
    <style>
        /* Pengaturan Dasar */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Kotak Konten Utama */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #2563eb; /* Warna biru aksen */
        }

        /* Ikon Perbaikan */
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        /* Judul */
        h1 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        /* Pesan Pengumuman */
        .message {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 25px;
            background-color: #fef2f2;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ef4444; /* Warna merah peringatan */
        }

        /* Nama Sekolah */
        .school-name {
            font-size: 18px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        /* Tahun Ajaran Highlights */
        .highlight {
            font-weight: bold;
            color: #111827;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Mohon Maaf, Halaman Sedang Dalam Tahap Perbaikan</h1>
        
        <div class="message">
            Untuk sementara waktu sistem tidak dapat diakses.<br><br>
            Bagi calon peserta didik yang <b>belum mendaftar SPMB <span class="highlight">2026/2027</span></b>, silakan datang <strong>langsung ke sekolah</strong> untuk melakukan pendaftaran secara luring (offline).
        </div>

        <div class="school-name">
            SMPN 1 Bandar Seikijang
        </div>
    </div>

</body>
</html>
